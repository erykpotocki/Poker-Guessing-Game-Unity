<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#072816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Poker&nbsp;zgadywany" />
    <meta name="apple-mobile-web-app-title" content="Poker&nbsp;zgadywany" />
    <link rel="manifest" href="manifest.webmanifest?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=4" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180.png?v=4" />
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #020b06; color: #fff; font-family: Arial, sans-serif; }
      body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
      #unity-container { width: 100%; height: 100dvh; max-width: 620px; background: #020b06; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #020b06; }
      #loading-screen { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); background: linear-gradient(#0004, #0005), url('boot-background.png?v=4') center / cover no-repeat, #020b06; text-align: center; opacity: 1; transition: opacity .35s ease; }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }
      #loading-content { width: min(92vw, 470px); display: grid; justify-items: center; }
      #loading-logo { display: block; width: 100%; height: auto; margin-bottom: clamp(34px, 8vh, 74px); animation: loading-pulse 4.5s ease-in-out infinite; }
      #loading-chip { display: block; width: clamp(86px, 25vw, 130px); height: auto; margin-bottom: 28px; animation: loading-spin 5.1s linear infinite; }
      #loading-status { margin: 0 0 16px; color: #fff8de; font-size: clamp(13px, 3.8vw, 17px); font-weight: bold; letter-spacing: .08em; }
      #loading-track { width: 100%; height: 14px; overflow: hidden; border: 1px solid #e6bd62; border-radius: 999px; background: #06190f; }
      #loading-progress { width: 0; height: 100%; background: linear-gradient(90deg, #9a6410, #f2c15c); transition: width .15s ease-out; }
      @keyframes loading-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes loading-spin { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) { #loading-logo, #loading-chip { animation: none; } }
      #update-notice { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; overflow-y: auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: #020b06; }
      #update-notice.visible { display: grid; }
      #update-card { width: min(100%, 400px); max-height: calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; border: 1px solid #e6bd62; border-radius: 18px; padding: clamp(20px, 6vw, 30px); color: #fff8de; background: linear-gradient(145deg, #0d4b2d, #062817); box-shadow: 0 18px 42px #000; text-align: center; }
      #update-card h2 { margin: 0 0 14px; color: #f2c15c; font-size: clamp(24px, 7vw, 32px); line-height: 1.1; overflow-wrap: anywhere; }
      #update-message { margin: 0 0 22px; font-size: clamp(16px, 4.5vw, 19px); font-weight: bold; line-height: 1.4; }
      #update-close { width: 100%; border: 1px solid #f2c15c; border-radius: 10px; padding: 12px; color: #fff8de; background: #9a6410; font-weight: bold; font-size: 15px; }
    </style>
  </head>
  <body>
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <section id="loading-screen" aria-live="polite">
          <div id="loading-content">
            <img id="loading-logo" src="boot-logo.png" alt="Poker zgadywany" />
            <img id="loading-chip" src="boot-chip.png" alt="" />
            <p id="loading-status">PRZYGOTOWYWANIE GRY · 0%</p>
            <div id="loading-track" role="progressbar" aria-label="Postęp ładowania" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="loading-progress"></div>
            </div>
          </div>
        </section>
        <section id="update-notice" aria-live="polite" aria-modal="true" role="dialog" aria-labelledby="update-title">
          <div id="update-card">
            <h2 id="update-title">Dostępna aktualizacja</h2>
            <p id="update-message">Aby wczytać nową wersję gry, uruchom aplikację ponownie.</p>
            <button id="update-close" type="button">URUCHOM PONOWNIE</button>
          </div>
        </section>
    </div>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const loadingScreen = document.querySelector('#loading-screen');
      const loadingStatus = document.querySelector('#loading-status');
      const loadingTrack = document.querySelector('#loading-track');
      const loadingProgress = document.querySelector('#loading-progress');
      const updateNotice = document.querySelector('#update-notice');
      const updateTitle = document.querySelector('#update-title');
      const updateMessage = document.querySelector('#update-message');
      const updateClose = document.querySelector('#update-close');
      const releaseVersion = '1.2.1';

      function showRestartNotice(title, message, version) {
        updateTitle.textContent = title;
        updateMessage.textContent = message;
        updateClose.textContent = 'URUCHOM PONOWNIE';
        updateClose.onclick = () => {
          updateClose.disabled = true;
          if (version) localStorage.setItem('poker-zgadywany-last-release', version);
          window.location.replace('reset.html?v=' + Date.now());
        };
        updateNotice.classList.add('visible');
      }

      async function checkForNewVersion() {
        try {
          const response = await fetch('release-notes.json', { cache: 'no-store' });
          if (!response.ok) return;
          const release = await response.json();
          const storageKey = 'poker-zgadywany-last-release';
          const previousVersion = localStorage.getItem(storageKey);
          if (previousVersion && previousVersion !== release.version) {
            showRestartNotice(
              'Dostępna aktualizacja',
              'Aby wczytać nową wersję gry, uruchom aplikację ponownie.',
              release.version
            );
            return false;
          }
          if (!previousVersion) localStorage.setItem(storageKey, release.version);
        } catch (_) {
          // Offline mode still works; update information is optional.
        }
        return true;
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register(`service-worker.js?v=${releaseVersion}`));
      }

      const buildUrl = 'Build';
      const config = {
        dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}?v=' + releaseVersion,
        frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}?v=' + releaseVersion,
        codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}?v=' + releaseVersion,
        streamingAssetsUrl: 'StreamingAssets',
        companyName: '{{{ COMPANY_NAME }}}',
        productName: '{{{ PRODUCT_NAME }}}',
        productVersion: '{{{ PRODUCT_VERSION }}}',
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };
      const script = document.createElement('script');
      script.src = buildUrl + '/{{{ LOADER_FILENAME }}}?v=' + releaseVersion;
      script.onload = () => createUnityInstance(canvas, config, progress => {
        const percent = Math.round(progress * 100);
        loadingProgress.style.width = percent + '%';
        loadingTrack.setAttribute('aria-valuenow', String(percent));
        loadingStatus.textContent = percent < 100
          ? 'PRZYGOTOWYWANIE GRY · ' + percent + '%'
          : 'URUCHAMIANIE GRY…';
      }).then(() => {
        loadingScreen.classList.add('hidden');
        window.setTimeout(() => { loadingScreen.style.display = 'none'; }, 400);
      }).catch(() => {
          showRestartNotice(
            'Wymagane ponowne uruchomienie',
            'Nie udało się wczytać wszystkich plików gry. Zamknij i uruchom aplikację ponownie.'
          );
        });
      script.onerror = () => showRestartNotice(
        'Wymagane ponowne uruchomienie',
        'Nie udało się wczytać aktualnej wersji gry. Sprawdź połączenie i uruchom aplikację ponownie.'
      );

      checkForNewVersion().then(canStart => {
        if (canStart) document.body.appendChild(script);
      });
    </script>
  </body>
</html>
