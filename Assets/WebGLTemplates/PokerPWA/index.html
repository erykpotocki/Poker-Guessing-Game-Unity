<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#072816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poker Zgadywany" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #020b06; color: #fff; font-family: Arial, sans-serif; }
      body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
      #unity-container { width: 100%; height: 100dvh; max-width: 620px; background: #020b06; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #020b06; }
      #error { position: fixed; inset: auto 20px 20px; z-index: 2; color: #ffb3a8; white-space: pre-wrap; text-align: center; }
      #update-notice { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; padding: 24px; background: rgba(0, 0, 0, .66); }
      #update-notice.visible { display: grid; }
      #update-card { width: min(100%, 360px); border: 1px solid #e6bd62; border-radius: 18px; padding: 24px; color: #fff8de; background: linear-gradient(145deg, #0d4b2d, #062817); box-shadow: 0 18px 42px #000; text-align: center; }
      #update-card h2 { margin: 0 0 10px; color: #f2c15c; font-size: 23px; }
      #update-card p { margin: 0 0 14px; font-weight: bold; }
      #update-changes { margin: 0 0 20px; padding-left: 22px; text-align: left; line-height: 1.35; }
      #update-changes li + li { margin-top: 8px; }
      #update-close { width: 100%; border: 1px solid #f2c15c; border-radius: 10px; padding: 12px; color: #fff8de; background: #9a6410; font-weight: bold; font-size: 15px; }
    </style>
  </head>
  <body>
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <p id="error" hidden></p>
        <section id="update-notice" aria-live="polite" aria-modal="true" role="dialog" aria-labelledby="update-title">
          <div id="update-card">
            <h2 id="update-title">Nowa wersja gry</h2>
            <p>Co się zmieniło:</p>
            <ul id="update-changes"></ul>
            <button id="update-close" type="button">ROZUMIEM</button>
          </div>
        </section>
    </div>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const error = document.querySelector('#error');
      const updateNotice = document.querySelector('#update-notice');
      const updateTitle = document.querySelector('#update-title');
      const updateChanges = document.querySelector('#update-changes');
      document.querySelector('#update-close').addEventListener('click', () => updateNotice.classList.remove('visible'));

      async function checkForNewVersion() {
        try {
          const response = await fetch('release-notes.json', { cache: 'no-store' });
          if (!response.ok) return;
          const release = await response.json();
          const storageKey = 'poker-zgadywany-last-release';
          const previousVersion = localStorage.getItem(storageKey);
          if (previousVersion !== release.version) {
            updateTitle.textContent = release.title || 'Nowa wersja gry';
            updateChanges.replaceChildren(...(release.changes || []).map(change => {
              const item = document.createElement('li');
              item.textContent = change;
              return item;
            }));
            updateNotice.classList.add('visible');
          }
          localStorage.setItem(storageKey, release.version);
        } catch (_) {
          // Offline mode still works; update information is optional.
        }
      }

      checkForNewVersion();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
      }

      const buildUrl = 'Build';
      const config = {
        dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
        frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: '{{{ COMPANY_NAME }}}',
        productName: '{{{ PRODUCT_NAME }}}',
        productVersion: '{{{ PRODUCT_VERSION }}}',
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };
      const script = document.createElement('script');
      script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
      script.onload = () => createUnityInstance(canvas, config).catch(message => {
        error.hidden = false;
        error.textContent = `Nie udało się uruchomić gry.\n${message}`;
      });
      document.body.appendChild(script);
    </script>
  </body>
</html>
