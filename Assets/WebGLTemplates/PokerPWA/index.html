<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#072816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poker Zgadywany" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #020b06; color: #fff; font-family: Arial, sans-serif; }
      body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
      #unity-container { width: 100%; height: 100dvh; max-width: 620px; background: #020b06; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #020b06; }
      #error { position: fixed; inset: auto 20px 20px; z-index: 2; color: #ffb3a8; white-space: pre-wrap; text-align: center; }
    </style>
  </head>
  <body>
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <p id="error" hidden></p>
    </div>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const error = document.querySelector('#error');
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
      }

      const buildUrl = 'Build';
      const config = {
        dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
        frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
        codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: '{{{ COMPANY_NAME }}}',
        productName: '{{{ PRODUCT_NAME }}}',
        productVersion: '{{{ PRODUCT_VERSION }}}',
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };
      const script = document.createElement('script');
      script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
      script.onload = () => createUnityInstance(canvas, config).catch(message => {
        error.hidden = false;
        error.textContent = `Nie udało się uruchomić gry.\n${message}`;
      });
      document.body.appendChild(script);
    </script>
  </body>
</html>
