<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#072816" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poker Zgadywany" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Poker Zgadywany</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #020b06; color: #fff; font-family: Arial, sans-serif; }
      body { min-height: 100dvh; display: grid; place-items: center; overflow: hidden; }
      #unity-container { width: 100%; height: 100dvh; max-width: 620px; background: #020b06; position: relative; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #020b06; }
      #update-notice { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; overflow-y: auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: #020b06; }
      #update-notice.visible { display: grid; }
      #update-card { width: min(100%, 400px); max-height: calc(100dvh - 36px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; border: 1px solid #e6bd62; border-radius: 18px; padding: clamp(20px, 6vw, 30px); color: #fff8de; background: linear-gradient(145deg, #0d4b2d, #062817); box-shadow: 0 18px 42px #000; text-align: center; }
      #update-card h2 { margin: 0 0 14px; color: #f2c15c; font-size: clamp(24px, 7vw, 32px); line-height: 1.1; overflow-wrap: anywhere; }
      #update-message { margin: 0 0 22px; font-size: clamp(16px, 4.5vw, 19px); font-weight: bold; line-height: 1.4; }
      #update-close { width: 100%; border: 1px solid #f2c15c; border-radius: 10px; padding: 12px; color: #fff8de; background: #9a6410; font-weight: bold; font-size: 15px; }
    </style>
  </head>
  <body>
      <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <section id="update-notice" aria-live="polite" aria-modal="true" role="dialog" aria-labelledby="update-title">
          <div id="update-card">
            <h2 id="update-title">Dostępna aktualizacja</h2>
            <p id="update-message">Aby wczytać nową wersję gry, uruchom aplikację ponownie.</p>
            <button id="update-close" type="button">URUCHOM PONOWNIE</button>
          </div>
        </section>
    </div>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const updateNotice = document.querySelector('#update-notice');
      const updateTitle = document.querySelector('#update-title');
      const updateMessage = document.querySelector('#update-message');
      const updateClose = document.querySelector('#update-close');
      const releaseVersion = '1.2.0';

      function showRestartNotice(title, message, version) {
        updateTitle.textContent = title;
        updateMessage.textContent = message;
        updateClose.textContent = 'URUCHOM PONOWNIE';
        updateClose.onclick = async () => {
          updateClose.disabled = true;
          if (version) localStorage.setItem('poker-zgadywany-last-release', version);
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(key => key.startsWith('poker-zgadywany-')).map(key => caches.delete(key)));
          }
          window.location.reload();
        };
        updateNotice.classList.add('visible');
      }

      async function checkForNewVersion() {
        try {
          const response = await fetch('release-notes.json', { cache: 'no-store' });
          if (!response.ok) return;
          const release = await response.json();
          const storageKey = 'poker-zgadywany-last-release';
          const previousVersion = localStorage.getItem(storageKey);
          if (previousVersion && previousVersion !== release.version) {
            showRestartNotice(
              'Dostępna aktualizacja',
              'Aby wczytać nową wersję gry, uruchom aplikację ponownie.',
              release.version
            );
            return false;
          }
          if (!previousVersion) localStorage.setItem(storageKey, release.version);
        } catch (_) {
          // Offline mode still works; update information is optional.
        }
        return true;
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register(`service-worker.js?v=${releaseVersion}`));
      }

      const buildUrl = 'Build';
      const config = {
        dataUrl: buildUrl + '/PWA.data.unityweb?v=' + releaseVersion,
        frameworkUrl: buildUrl + '/PWA.framework.js.unityweb?v=' + releaseVersion,
        codeUrl: buildUrl + '/PWA.wasm.unityweb?v=' + releaseVersion,
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'DefaultCompany',
        productName: 'Poker Zgadywany',
        productVersion: '1.0',
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };
      const script = document.createElement('script');
      script.src = buildUrl + '/PWA.loader.js?v=' + releaseVersion;
      script.onload = () => createUnityInstance(canvas, config).catch(() => {
        showRestartNotice(
          'Wymagane ponowne uruchomienie',
          'Nie udało się wczytać wszystkich plików gry. Zamknij i uruchom aplikację ponownie.'
        );
      });
      script.onerror = () => showRestartNotice(
        'Wymagane ponowne uruchomienie',
        'Nie udało się wczytać aktualnej wersji gry. Sprawdź połączenie i uruchom aplikację ponownie.'
      );

      checkForNewVersion().then(canStart => {
        if (canStart) document.body.appendChild(script);
      });
    </script>
  </body>
</html>
